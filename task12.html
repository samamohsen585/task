<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animated Countdown Timer</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>

    <div class="container">
        <h1>Animated Countdown Timer</h1>
        <div class="input-group">
        <input type="number" id="timeInput" min="1" placeholder="  ">           
         <button id="startBtn">Start Countdown</button>
        </div>
        <div id="display" class="timer-display"></div>
        <div class="history-card">
            <h3>Countdown History</h3>
            <div id="historyList"></div>
        </div>
    </div>
    <script src="script3.js" defer></script>
</body>
</html>
