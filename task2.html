<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destinations</title>
</head>
<body>
    <table border="1" cellpadding="12" cellspacing="0" align="center" width="700">
        <thead>
            <tr>
                <th><b>Country</b></th>
                <th><b>City</b></th>
                <th><b>Why Visit?</b></th>
                <th><b>Photo</b></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Japan</td>
                <td>Kyoto</td>
                <td>Beautiful temples and cherry blossoms</td>
                <td>
                    <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/2b/e6/6d/87/caption.jpg?w=1200&h=700&s=1&cx=2550&cy=1700&chk=v1_07f8c3fadbb1e4b056fe" alt="Kyoto Temple" width="180">
                </td>
            </tr>
            <tr>
                <td>France</td>
                <td>Paris</td>
                <td>Romantic vibe and Eiffel Tower</td>
                <td>
                    <img src="https://lh3.googleusercontent.com/grass-cs/ACvplmNIJfinzZBrBi-oqt-ezkvaRsIdP_qKI-F0KOZGs49vNCALC6toEOlQNzd5TSHK_z59K4k_TAMJUWWSYQIX95DgUeecEgA5ml0waPa9p8CW6LfhARmWVIXD_goNt7KNvLqWnJyiGw=w270-h312-n-k-no" alt="Eiffel Tower" width="180">
                </td>
            </tr>
            <tr>
                <td>Egypt</td>
                <td>Cairo</td>
                <td>Great Pyramids and ancient history</td>
                <td>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7QQ2YOKpa0rEP0sZt3JLvh0GNWa23yN8cN_YRQOUulA&s=10" alt="Pyramids" width="180">
                </td>
            </tr>
            <tr>
                <td>Italy</td>
                <td>Venice</td>
                <td>Romantic canals and gondolas</td>
                <td>
                    <img src="venice.jpg" alt="Venice Canal" width="100">
                </td>
            </tr>
            <tr>
                <td>>USA</td>
                <td>New York</td>
                <td>Skyscrapers and Broadway shows</td>
                <td>
                    <img src="newyork.jpg" alt="New York Skyline" width="100">
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
